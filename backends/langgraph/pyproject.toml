# pyproject.toml for the LangGraph-based FastAPI backend.
#
# This package depends on council-core (the shared library) and will add
# langgraph + fastapi as dependencies when those modules are implemented.
#
# langchain provides init_chat_model (the provider factory used by fanout.py);
# each provider needs its own integration package alongside it — langchain-openai
# today, langchain-anthropic / langchain-google-genai / langchain-ollama as those
# providers are enabled in config.yaml.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "council-langgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "council-core",
    "langchain>=1.0",            # init_chat_model — provider-agnostic chat model factory
    "langchain-openai>=1.0",     # OpenAI integration — one integration package per enabled provider
    "langchain-anthropic>=1.0",  # Anthropic integration
    "python-dotenv>=1.0",        # Loads .env so API keys reach os.environ without a shell export
]

[tool.uv.sources]
council-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["council_langgraph"]
